# Proton Mail Bridge for your LAN, configured at https://<this-host>:8080
#
#   docker compose -f docker/docker-compose.yml up -d             # pulls the published image
#   docker compose -f docker/docker-compose.yml up -d --build     # or builds it from this source tree
#   docker compose -f docker/docker-compose.yml logs mailbridge   # shows the first-start web UI password

services:
  mailbridge:
    image: ghcr.io/avandeputte/proton-bridge:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: mailbridge
    restart: unless-stopped
    ports:
      # host:container. Change the left side if a port is already taken on the host,
      # and set MAILBRIDGE_IMAP_PORT / MAILBRIDGE_SMTP_PORT so the web UI shows the right numbers.
      - "8080:8080"   # web UI (HTTPS, self-signed)
      - "143:143"     # IMAP (STARTTLS)
      - "587:587"     # SMTP (STARTTLS)
      # - "993:993"   # IMAP (SSL/TLS), Dovecot mode with MAILBRIDGE_IMAPS_LISTEN only
    volumes:
      - mailbridge-data:/data
    environment:
      TZ: "Etc/UTC"
      # Name or IP your mail clients use to reach this host. Optional: by default the
      # web UI shows whatever name you typed into the browser.
      # MAILBRIDGE_HOSTNAME: "nas.lan"
      # Fixed web UI password. Optional: without it a random one is generated on first
      # start, printed to the log, and can be changed in the web UI.
      # MAILBRIDGE_PASSWORD: "change-me-please"
      # Dovecot mode: mail clients talk to a bundled Dovecot that is kept in two-way
      # sync with bridge. Adds fast full-text search and a complete IMAP server, and
      # keeps a second copy of the mail in the volume. See docker/README.md.
      # MAILBRIDGE_DOVECOT: "on"
      # MAILBRIDGE_IMAPS_LISTEN: ":993"
      # Behind a reverse proxy: the address the proxy serves the web UI at. This, and
      # the server name and ports of a TCP proxy in front of IMAP and SMTP, can also be
      # entered in the web UI under Settings. See docker/README.md.
      # MAILBRIDGE_PUBLIC_URL: "https://example.com/mailbridge"
      # A Let's Encrypt certificate for the web UI, IMAP and SMTP, fetched and renewed
      # by the container through your DNS provider's API. It can also be set up in the
      # web UI, in the Certificate card; set here, the form there is switched off.
      # See docker/README.md.
      # MAILBRIDGE_ACME_DOMAINS: "mail.example.com"
      # MAILBRIDGE_ACME_DNS: "cloudflare"
      # CLOUDFLARE_DNS_API_TOKEN: "your-token"
      # MAILBRIDGE_ACME_SERVER: "staging"   # test certificates while you set it up
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Only used by the entrypoint to take ownership of /data and switch to an
      # unprivileged user; bridge and the web UI run without any capability.
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER

volumes:
  mailbridge-data:
